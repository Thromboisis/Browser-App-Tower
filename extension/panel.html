<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Tower Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #181b22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: block;
    }
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #181b22;
      color: #94a3b8;
      font-size: 13px;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <span id="loading-text">Loading app...</span>
  </div>
  
  <iframe 
    id="app-frame" 
    allow="clipboard-read; clipboard-write; microphone; camera; notifications; geolocation; autoplay">
  </iframe>

  <script src="panel.js"></script>
</body>
</html>
