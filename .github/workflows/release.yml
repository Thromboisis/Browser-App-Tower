name: Build & Release Extension Packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Extensions for Chrome & Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Detect version and check for release
        id: version_check
        run: |
          # Fetch all remote tags
          git fetch --tags --force || true

          # Read version from extension/manifest.json
          VERSION=$(node -p "require('./extension/manifest.json').version")
          TAG="v$VERSION"
          echo "Detected extension version: $VERSION (tag: $TAG)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            if [ "${{ github.ref_name }}" = "$TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Explicit run for tag or workflow dispatch; will create/update release."
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "Standard push without version change; skipping release creation."
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "New version $TAG detected! Proceeding to publish release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Build extension packages
        run: npm run pack

      - name: Upload Extension Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages-${{ steps.version_check.outputs.tag }}
          path: |
            dist/app-tower-chrome.zip
            dist/app-tower-firefox.zip

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: steps.version_check.outputs.should_release == 'true'
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: Release ${{ steps.version_check.outputs.tag }}
          files: |
            dist/app-tower-chrome.zip
            dist/app-tower-firefox.zip
          draft: false
          prerelease: false
          generate_release_notes: true

